<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!--
    Meu login texture — terminal style, seamless 640px tile, transparent base.
    Fine grid + scanlines + block-cursor accents.
  -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="640" fill="url(#grid)"/>
  <rect width="640" height="640" fill="url(#scan)"/>

  <!-- row highlight bands (terminal zebra) -->
  <rect x="0" y="128" width="640" height="16" fill="#ff2e88" fill-opacity="0.03"/>
  <rect x="0" y="384" width="640" height="16" fill="#ff2e88" fill-opacity="0.03"/>

  <!-- sparse block cursors -->
  <rect x="96" y="160" width="10" height="16" fill="#ff2e88" fill-opacity="0.35"/>
  <rect x="480" y="448" width="10" height="16" fill="#ff2e88" fill-opacity="0.25"/>
  <rect x="288" y="288" width="10" height="16" fill="#ffffff" fill-opacity="0.12"/>

  <!-- prompt markers -->
  <g font-family="monospace" font-size="12" fill-opacity="0.18">
    <text x="64" y="172" fill="#ff4fa3">&gt;_</text>
    <text x="448" y="460" fill="#ff4fa3">&gt;_</text>
    <text x="256" y="300" fill="#ffffff">::</text>
  </g>
</svg>
