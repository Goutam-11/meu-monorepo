<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Meu logo">
  <defs>
    <linearGradient id="meuG" x1="8" y1="56" x2="58" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset=".55" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ff7ab8"/>
    </linearGradient>
    <linearGradient id="meuGsoft" x1="8" y1="56" x2="58" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fae" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8fc4" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <!-- candle 1 (left leg of M) -->
  <rect x="9" y="30" width="9" height="26" rx="4.5" fill="url(#meuG)"/>
  <rect x="12.25" y="20" width="2.5" height="10" rx="1.25" fill="url(#meuGsoft)"/>
  <!-- candle 2 (middle, tallest) -->
  <rect x="27.5" y="14" width="9" height="42" rx="4.5" fill="url(#meuG)"/>
  <rect x="30.75" y="6" width="2.5" height="8" rx="1.25" fill="url(#meuGsoft)"/>
  <!-- candle 3 (right leg of M) -->
  <rect x="46" y="24" width="9" height="32" rx="4.5" fill="url(#meuG)"/>
  <rect x="49.25" y="15" width="2.5" height="9" rx="1.25" fill="url(#meuGsoft)"/>
  <!-- trend line tying the M silhouette -->
  <path d="M13.5 33 L32 19 L50.5 28" stroke="#ffffff" stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
