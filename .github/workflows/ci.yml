name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  frontend:
    name: Frontend (tests, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: meu_frontend
    env:
      # Build-time placeholders only. No workflow connects to a database,
      # broker or provider; the suites use fixtures and fakes.
      DATABASE_URL: mongodb://127.0.0.1:27017/ci
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-secret
      ENCRYPTION_KEY: ci-placeholder-encryption-key
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install scheduler dependencies
        # The frontend imports scheduler modules by relative path, so their
        # dependencies (zod, ccxt) must resolve from that package.
        run: bun install --frozen-lockfile
        working-directory: meu/schedulerService
      - name: Install notification dependencies
        run: bun install --frozen-lockfile
        working-directory: meu/notificationService
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Tests
        run: bun run test
      - name: Types
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build

  scheduler:
    name: Scheduler (tests, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meu/schedulerService
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Types
        run: bun run typecheck

  notification:
    name: Notifications (tests, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meu/notificationService
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Types
        run: bun run typecheck
